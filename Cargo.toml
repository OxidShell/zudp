[package]
name = "zudp"
version = "0.4.1"
edition = "2024"
description = "Zero-overhead UDP protocol with optional reliability, fragmentation, and relay support"
license = "MIT"
repository = "https://github.com/OxidShell/zudp"
homepage = "https://github.com/OxidShell/zudp"
documentation = "https://docs.rs/zudp"
readme = "README.md"
exclude = ["skill/"]
keywords = ["udp", "networking", "gamedev", "relay", "protocol"]
categories = ["network-programming", "game-development", "asynchronous"]

[features]
# No message codec by default: pick one below, implement `Encode` and
# `Decode` by hand, or send `RawBytes`.
default = []
# Wire codec for message types: bincode 2 `standard()` layout (varint
# integers, little endian), no serde.
wincode = ["dep:wincode"]
rkyv = ["dep:rkyv"]
bitcode = ["dep:bitcode"]
serde = ["dep:serde", "dep:postcard"]
discovery = []
security = ["dep:snow"]
# Lets a socket act as a public relay node for clients behind NAT.
relay = ["security"]

[dependencies]
tokio = { version = "1", features = ["net", "sync", "rt-multi-thread", "macros", "time", "io-util"] }
bytes = "1"
wincode = { version = "0.6", default-features = false, features = ["derive", "std"], optional = true }
rkyv = { version = "0.8", features = ["bytecheck"], optional = true }
bitcode = { version = "0.6", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
postcard = { version = "1", features = ["alloc"], optional = true }
snow = { version = "0.9", features = ["default-resolver"], optional = true }
tracing = "0.1"
socket2 = { version = "0.5", features = ["all"] }
parking_lot = "0.12"
dashmap = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Networking_WinSock", "Win32_System_IO"] }

[dev-dependencies]
# No codec is on by default: tests, examples, benches and doc tests use
# wincode. A path-only dev-dependency is dropped on publish.
zudp = { path = ".", features = ["wincode"] }
snow = "0.9"
anyhow = "1"
tracing-subscriber = "0.3"
criterion = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }

[[test]]
name = "discovery"
required-features = ["discovery"]

[[test]]
name = "relay"
required-features = ["relay"]

[[bench]]
name = "zudp"
harness = false

[[example]]
name = "ping_pong"
path = "examples/ping_pong.rs"

[[example]]
name = "fragmentation"
path = "examples/fragmentation.rs"

[[example]]
name = "relay"
path = "examples/relay.rs"
required-features = ["relay"]

[[example]]
name = "discovery_advertise"
path = "examples/discovery_advertise.rs"
required-features = ["discovery"]

[[example]]
name = "discovery_scan"
path = "examples/discovery_scan.rs"
required-features = ["discovery"]

[[example]]
name = "secure_ping_pong"
path = "examples/secure_ping_pong.rs"
required-features = ["security"]

[[example]]
name = "multi_stream"
path = "examples/multi_stream.rs"

[[example]]
name = "server"
path = "examples/server.rs"

[[example]]
name = "client"
path = "examples/client.rs"

[[example]]
name = "observability"
path = "examples/observability.rs"

[[example]]
name = "key_pinning"
path = "examples/key_pinning.rs"
required-features = ["security"]
